# Phase 1: Sparse-Label Training (Strategy A)
# Loss branching + DualStream dataloader
# GPU: 0 | T=8 (Unified Temporal Context)

ablation:
  use_mamba: true
  mamba_version: "mamba3"
  use_sclera_containment: false
  use_sphere_head: false
  use_weakmed: true

data:
  dataset: dual_stream
  semantic_gt_root: /home/iulab1/PycharmProjects/nnUNet/Openedsdata2019/Semantic_Segmentation_Dataset
  sequence_root: /home/iulab1/PycharmProjects/nnUNet/Openedsdata2019/Sequence_Extracted
  temporal_window: 8
  unlabeled_stride: 3
  preprocessing: ritnet
  target_resolution: [448, 448]
  input_crop: [120, 520, 0, 400]
  padding: 48

model:
  backbone: vivim
  base_channels: 32
  num_classes: 4
  mamba:
    d_state: 16
    d_conv: 4
    expand: 2
    headdim: 64

training:
  batch_size: 8
  n_labeled_per_batch: 2
  epochs: 1000
  lr: 0.001
  precision: "bf16"
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  num_workers: 4
  weight_decay: 0.0001
  pretrained_checkpoint: /home/iulab1/PycharmProjects/nnUNet/nnUNet_results/Dataset600_OpenEDS2019/nnUNetTrainer_Vivim__nnUNetPlans__2d/fold_1/checkpoint_best.pth
  unsup_rampup_epochs: 30
  unsup_weight: 0.2
  early_stopping:
    patience: 500
    min_epochs: 50

losses:
  seg_dice_ce:
    weight: 1.0
  weakmed_m2b:
    weight: 0.5
  weakmed_sc:
    weight: 0.5
  entropy_min:
    weight: 0.05

experiment:
  name: phase1_sparse_t8
  seed: 42

logging:
  wandb_project: eyeball-3d
  wandb_run_prefix: phase1_sparse_t8
