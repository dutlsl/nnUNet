experiment:
  name: "vivim_weakmed_400x400"
  seed: 42

data:
  dataset: "openeds_sequence"
  sequence_root: "/home/iulab0/PycharmProjects/nnUNet/Openedsdata2019/Sequence_Extracted"
  pseudo_label_root: "/home/iulab0/PycharmProjects/nnUNet/Openedsdata2019/Sequence_PseudoLabels_400"
  crop: [120, 520, 0, 400]  # [y_start, y_end, x_start, x_end] -> (400, 400)
  padded_resolution: [448, 448]
  temporal_window: 3
  normalize:
    mean: 86.45
    std: 39.94

model:
  backbone: "vivim"  # "vivim" or "plainconv_unet"
  num_classes: 4
  base_channels: 32
  mamba:
    d_state: 16
    d_conv: 4
    expand: 2

ablation:
  use_mamba: true
  use_weakmed: true

losses:
  projection:
    weight: 1.0
  weakmed_m2b:
    weight: 0.5
  weakmed_sc:
    weight: 0.3

training:
  epochs: 150
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 4
  early_stopping:
    min_epochs: 50
    patience: 30

logging:
  wandb_project: "eyeball-3d"
  wandb_run_prefix: "weakmed_vivim"
