# ==============================================================================
# SAGD (Structure-Aware Domain Generalization) Configuration
# Applied on top of Vivim+Mamba3 backbone for eyeball segmentation
#
# All paths use ${PROJECT_ROOT} placeholder, resolved at runtime by:
#   1. Environment variable NNUNET_PROJECT_ROOT
#   2. Auto-detection from config file location (../configs -> project root)
# ==============================================================================

experiment:
  name: sagd_vivim
  seed: 42

ablation:
  use_mamba: true
  use_sadg: true
  use_sas: true        # Structure-Aware Serialization (Module 1 ONLY)
  use_hdm: false       # Hierarchical Domain Modeling (DISABLED)
  use_sga: false       # Spectral Graph Alignment (DISABLED)
  use_weakmed: false
  use_eyeball_head: false

model:
  backbone: vivim
  base_channels: 32
  num_classes: 4
  mamba:
    d_state: 16
    d_conv: 4
    expand: 2

  # SAS-2D: Structure-Aware Serialization
  sas:
    num_tokens: 576           # 24x24 bottleneck spatial tokens
    feature_h: 24
    feature_w: 24
    cds_num_neighbors: 8      # BFS/KNN neighbor count for CDS
    gcs_diffusion_time: 2.0   # Heat diffusion time parameter t
    gcs_num_eigenvectors: 32  # Number of Laplacian eigenvectors for GCS
    cache_serialization: true # Cache serialization order per epoch

  # HDM-2D: Hierarchical Domain Modeling
  hdm:
    num_domains: 2              # OpenEDS, Swirski (LPW deprecated)
    mamba_d_state: 16
    mamba_d_conv: 4
    mamba_expand: 2
    interleave_chunk_size: 64   # Tokens per chunk in IRF interleaving

  # SGA-2D: Spectral Graph Alignment (test-time only)
  sga:
    prototype_momentum: 0.999   # EMA momentum for prototype bank update
    num_prototypes_per_class: 4 # Number of prototypes per semantic class
    alignment_temperature: 0.1  # Temperature for spectral alignment softmax
    spectral_k: 16              # Number of eigenvectors for graph alignment

data:
  dataset: multi_domain
  temporal_window: 3
  input_resolution: [192, 192]

  # RITnet preprocessing (spec.md §4)
  preprocess:
    gamma: 0.8
    clahe_clip_limit: 1.5
    clahe_tile_grid: [8, 8]
    normalize_mean: 0.5
    normalize_std: 0.5

  # Domain 1: OpenEDS 2019 (primary, sequential video dataset T=3, 4-class labels)
  openeds:
    sequence_root: ${PROJECT_ROOT}/Openedsdata2019/Sequence_Extracted
    pseudo_label_root: ${PROJECT_ROOT}/Openedsdata2019/Sequence_PseudoLabels_400
    original_crop: [120, 520, 0, 400]    # Original 640x400 -> 400x400 crop
    num_classes: 4

  # Domain 2: Swirski (pupil ellipse -> binary mask)
  swirski:
    root: ${PROJECT_ROOT}/../transUnet/Swirski_Dataset
    subsets: [p1-left, p1-right, p2-left, p2-right]
    label_type: ellipse  # pupil-ellipses.txt -> binary mask conversion



training:
  batch_size: 18
  num_workers: 2
  gpu_ids: [0, 1]
  grad_clip: 12.0
  pretrained_checkpoint: null  # Set to path like ${PROJECT_ROOT}/nnUNet_results/.../checkpoint_best.pth

losses:
  warmup_epochs: 20  # SADG aux losses ramp 0→1 over 20 epochs (DiceCE converges first)
  seg:
    type: dice_ce
    weight: 1.0
    dice_weight: 1.0
    ce_weight: 0.3
    class_weights: [0.1, 1.0, 1.0, 1.0]  # suppress background gradient dominance
  domain_consistency:
    weight: 0.1  # Token-level MMD (feature alignment only, NO labels from aux domains)
    temperature: 1.0
  structural_contrastive:
    weight: 0.05
    num_negatives: 256

logging:
  wandb_project: sagd-eyeball
  wandb_run_prefix: sagd
